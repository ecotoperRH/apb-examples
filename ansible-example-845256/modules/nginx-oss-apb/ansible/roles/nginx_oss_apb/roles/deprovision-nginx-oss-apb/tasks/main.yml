- name: Delete NGINX OSS APB ingress
  kubernetes.core.k8s:
    state: absent
    api_version: networking.k8s.io/v1
    kind: Ingress
    name: nginx-oss-apb
    namespace: '{{ namespace }}'
- name: Delete NGINX OSS APB service
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Service
    name: nginx-oss-apb
    namespace: '{{ namespace }}'
- name: Delete NGINX OSS APB deployment
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: nginx-oss-apb
    namespace: '{{ namespace }}'
- name: Delete NGINX OSS APB configmap
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: nginx-conf
    namespace: '{{ namespace }}'
