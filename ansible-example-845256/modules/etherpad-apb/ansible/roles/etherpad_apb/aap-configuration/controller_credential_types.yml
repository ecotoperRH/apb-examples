---
controller_credential_types:
- name: Etherpad MariaDB Credentials
  description: MariaDB database credentials for the Etherpad APB deployment, including
    root password, application user, and application password
  kind: cloud
  inputs:
    fields:
    - id: mariadb_name
      type: string
      label: MariaDB Database Name
      help_text: Name of the MariaDB database used by Etherpad (e.g., 'etherpad')
    - id: mariadb_user
      type: string
      label: MariaDB Application User
      help_text: MariaDB application user account for Etherpad database access
    - id: mariadb_password
      type: string
      label: MariaDB Application User Password
      secret: true
      help_text: "Password for the MariaDB application user; must be vaulted \u2014\
        \ default 'admin' is insecure"
    - id: mariadb_root_password
      type: string
      label: MariaDB Root Password
      secret: true
      help_text: "Root password for the MariaDB instance; must be vaulted \u2014 default\
        \ 'admin' is insecure"
    required:
    - mariadb_name
    - mariadb_user
    - mariadb_password
    - mariadb_root_password
  injectors:
    extra_vars:
      mariadb_name: !unsafe '{{ mariadb_name }}'
      mariadb_user: !unsafe '{{ mariadb_user }}'
      mariadb_password: !unsafe '{{ mariadb_password }}'
      mariadb_root_password: !unsafe '{{ mariadb_root_password }}'
- name: Etherpad Admin Credentials
  description: Etherpad Lite admin user credentials injected into the Etherpad DeploymentConfig
  kind: cloud
  inputs:
    fields:
    - id: etherpad_admin_user
      type: string
      label: Etherpad Admin Username
      help_text: 'Admin username for the Etherpad Lite web application (default: ''etherpad'')'
    - id: etherpad_admin_password
      type: string
      label: Etherpad Admin Password
      secret: true
      help_text: "Admin password for the Etherpad Lite web application; must be vaulted\
        \ \u2014 default 'admin' is insecure"
    required:
    - etherpad_admin_password
  injectors:
    extra_vars:
      etherpad_admin_user: !unsafe '{{ etherpad_admin_user }}'
      etherpad_admin_password: !unsafe '{{ etherpad_admin_password }}'
