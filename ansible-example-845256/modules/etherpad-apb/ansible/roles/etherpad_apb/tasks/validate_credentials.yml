---
- name: Validate required credential variables are defined
  ansible.builtin.assert:
    that:
      - mariadb_name is defined
      - mariadb_user is defined
      - mariadb_password is defined
      - mariadb_root_password is defined
      - etherpad_admin_user is defined
      - etherpad_admin_password is defined
    fail_msg: One or more required credential variables are not defined. Ensure the AAP credential type is attached to the job template.
    quiet: true
